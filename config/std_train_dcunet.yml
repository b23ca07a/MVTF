# avse challenge original
    
MaskNet:
    n_fft: 512
    hop_length: 320
    win_length: 512
    embd_dim: 512
    feature_dim: 257

MaskNetV2:
    n_fft: 512
    hop_length: 320
    win_length: 512
    embd_dim: 512
    feature_dim: 257
    fc_dim: 16
    emb_ks: 1
    emb_hs: 1
    num_layers: 3
    lstm_hidden_units: 32

RandomRirGenerator_kwargs:
    fs: 16000
    t60_range: [ 0.05, 0.55 ] # rvb:[0.05, 0.7]
    roomdim_range_x: [ 4.0, 10.0 ]
    roomdim_range_y: [ 4.0, 8.0 ]
    roomdim_range_z: [ 2.5, 6.0 ]
    micpos_range_z: [ 0.8, 1.2 ]
    micpos: linear
    # micarray: custom_linear6
    micarray: mono