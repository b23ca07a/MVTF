# avse challenge original
tfgridnet_kwargs:
    n_srcs: 1
    n_fft: 128
    stride: 64
    window: hann
    n_imics: 1
    n_layers: 6
    lstm_hidden_units: 192
    attn_n_head: 6
    attn_approx_qk_dim: 512
    emb_dim: 48
    emb_ks: 4
    emb_hs: 2
    activation: prelu
    eps: 1.0e-5
    use_builtin_complex: True
    ref_channel: -1

stft_kwargs:
    n_fft: 128
    win_length: 128
    hop_length: 64
    window: hann
    use_builtin_complex: True